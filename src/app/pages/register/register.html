<div class="auth-container">
  <div class="auth-card">
    <div class="auth-header">
      <div class="auth-icon">🤝</div>
      <h1>Join HandiMatched</h1>
      <p>Create your free account and start connecting</p>
    </div>

    @if (error) {
      <div class="error-message" role="alert">{{ error }}</div>
    }

    <form (ngSubmit)="onSubmit()" #regForm="ngForm" class="auth-form">
      <div class="form-group">
        <label for="name">Full Name</label>
        <input
          id="name"
          type="text"
          [(ngModel)]="name"
          name="name"
          placeholder="Your name"
          required
          autocomplete="name"
        />
      </div>

      <div class="form-group">
        <label for="email">Email Address</label>
        <input
          id="email"
          type="email"
          [(ngModel)]="email"
          name="email"
          placeholder="you@example.com"
          required
          autocomplete="email"
        />
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <input
          id="password"
          type="password"
          [(ngModel)]="password"
          name="password"
          placeholder="At least 6 characters"
          required
          autocomplete="new-password"
        />
      </div>

      <div class="form-group">
        <label for="confirmPassword">Confirm Password</label>
        <input
          id="confirmPassword"
          type="password"
          [(ngModel)]="confirmPassword"
          name="confirmPassword"
          placeholder="Repeat your password"
          required
          autocomplete="new-password"
        />
      </div>

      <label class="checkbox-label">
        <input type="checkbox" [(ngModel)]="agreed" name="agreed" />
        <span>I agree to the <a href="#" (click)="$event.preventDefault()">Terms of Service</a> and <a href="#" (click)="$event.preventDefault()">Privacy Policy</a></span>
      </label>

      <button type="submit" class="btn-submit" [disabled]="loading">
        {{ loading ? 'Creating account...' : 'Create Account' }}
      </button>
    </form>

    <p class="auth-footer">
      Already have an account? <a routerLink="/login">Sign in</a>
    </p>
  </div>
</div>
